[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caddev"
version = "0.1.0"
description = "Incremental STEP builds and assemblies for build123d projects"
requires-python = ">=3.11"

dependencies = [
    "build123d",
    "watchfiles",
]

[project.scripts]
caddev = "caddev.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/caddev"]

[tool.hatch.build.targets.wheel.force-include]
"src/caddev/fontconfig/fonts.conf" = "caddev/fontconfig/fonts.conf"

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = ["black", "pyright"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = ["src"]

[tool.black]
line-length = 100
